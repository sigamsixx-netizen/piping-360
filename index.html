<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배관기능사 최근 5회분 스마트 정복 앱</title>
<style>
  :root{
    --bg-dark:#181c24; --bg-card:#222834; --bg-opt:#2a3242;
    --orange:#e67e22; --orange-dark:#a05312; --brass:#f39c12;
    --text:#e0e6ed; --text-dim:#94a3b8; --green:#27ae60; --red:#e74c3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:16px 12px 40px; background:var(--bg-dark); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
  }
  .container{width:100%; max-width:480px;}
  header{text-align:center; margin-bottom:12px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; color:var(--orange); letter-spacing:1px; background:rgba(230,126,34,0.15); padding:3px 8px; border-radius:4px; margin-bottom:4px;}
  h1{font-size:20px; font-weight:800; margin:4px 0;}
  .sub{font-size:12px; color:var(--text-dim);}
  
  .mode-box{background:#2a2015; border:1px solid var(--orange-dark); padding:10px 12px; border-radius:10px; font-size:12px; color:#fdeada; margin-bottom:12px; line-height:1.5;}
  .mode-box b{color:var(--brass);}

  .score-bar{display:grid; grid-template-columns:1fr 1fr; gap:8px; background:var(--bg-card); padding:12px 14px; border-radius:10px; border:1px solid #333d4f; margin-bottom:12px; font-size:13px;}
  .score-item b{color:var(--brass);}
  
  .qcard{background:var(--bg-card); border:1px solid #333d4f; border-radius:14px; padding:18px; margin-bottom:14px; position:relative;}
  .qtag{font-size:11px; font-weight:700; color:var(--orange); margin-bottom:6px; display:inline-block;}
  .qweight{float:right; font-size:11px; color:var(--red); font-weight:700;}
  .qtitle{font-size:15.5px; font-weight:700; line-height:1.5; margin:8px 0 16px; clear:both;}
  
  .opt-btn{
    display:block; width:100%; text-align:left; background:var(--bg-opt); border:1px solid #3b465a;
    color:var(--text); padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:14px; cursor:pointer;
  }
  .opt-btn.correct{background:#1b432c; border-color:var(--green); color:#a3e6be;}
  .opt-btn.wrong{background:#4a1e1b; border-color:var(--red); color:#f8b4b4;}
  .opt-btn.disabled{pointer-events:none;}
  
  .exp-box{margin-top:12px; padding:12px; background:#1e1711; border:1px solid var(--orange-dark); border-radius:8px; font-size:13px; line-height:1.5; color:#fceade; display:none;}
  .exp-box.show{display:block;}
  
  .nav-bar{display:flex; justify-content:space-between; margin-top:14px;}
  .btn{padding:10px 18px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-next{background:var(--orange); color:#fff; margin-left:auto;}
  
  .status-text{font-size:11px; color:var(--text-dim); text-align:center; margin-top:12px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">구글 드라이브 최신 5회분 추출 탑재</div>
    <h1>배관기능사 스마트 정복 앱</h1>
    <div class="sub">최신 회차 집중 풀이 + 누적 오답 복습</div>
  </header>

  <div class="mode-box">
    🔄 <b>최신 5회분 문제 탑재:</b> 모아두신 PDF 최신 회차 문제들로 교체되었으며, 틀린 문제는 자동으로 우선 노출됩니다.
  </div>

  <div class="score-bar">
    <div class="score-item">누적 풀이: <b id="statTotal">0회</b></div>
    <div class="score-item">누적 정답률: <b id="statRate" style="color:var(--brass)">0.0%</b></div>
    <div class="score-item">정답: <b id="statCorrect" style="color:var(--green)">0회</b></div>
    <div class="score-item">오답: <b id="statWrong" style="color:var(--red)">0회</b></div>
  </div>

  <div id="quizArea">
    <div class="qcard">
      <span class="qtag" id="qTag">회차</span>
      <span class="qweight" id="qWeight">출제순위: 보통</span>
      <div class="qtitle" id="qTitle">문제 준비 중...</div>
      <div id="qOpts"></div>
      <div class="exp-box" id="qExp"></div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-next" id="btnNext" style="display:none;">다음 문제 →</button>
    </div>
  </div>

  <div class="status-text" id="syncStatus">동기화 준비 완료</div>
</div>

<script>
// 구글 드라이브 최근 5개 회차 핵심 기출 데이터셋
const DATA_360 = [
  {"id": 1, "tag": "최근 1회차 - 01번", "q": "배관의 열팽창에 따른 신축을 흡수하기 위해 설치하는 신축이음 중 구조가 단순하고 고온·고압 배관에 주로 사용되며 관 자체의 굽힘을 이용하는 이음은?", "opts": ["루프형 이음", "슬리브형 이음", "벨로즈형 이음", "스위블형 이음"], "correct": 0, "exp": "루프형(곡선관) 이음은 관 자체의 휨을 이용하므로 고온·고압 배관에 가장 적합합니다."},
  {"id": 2, "tag": "최근 1회차 - 02번", "q": "동관의 접합 방법 중 나팔 모양으로 확관하여 자루 너트로 체결하는 이음 방식은?", "opts": ["플레어 이음", "납땜 이음", "용접 이음", "플랜지 이음"], "correct": 0, "exp": "플레어링 툴을 사용해 동관 끝을 나팔 모양으로 넓혀 연결하는 방식을 플레어(나팔) 이음이라고 합니다."},
  {"id": 3, "tag": "최근 1회차 - 03번", "q": "보일러 통풍 방식 중 압송 통풍(강제 통풍)에 대한 설명으로 옳은 것은?", "opts": ["압송 팬을 사용하여 연소실 내를 정압으로 유지한다", "흡입 팬만 사용하여 연차가 높은 연돌을 필요로 한다", "자연 통풍과 구조가 동일하다", "연소 가스 역류 위험이 전혀 없다"], "correct": 0, "exp": "압송 통풍은 연소용 공기를 押し込む(밀어 넣는) 방식으로 연소실 내부가 정압(+)이 됩니다."},
  {"id": 4, "tag": "최근 1회차 - 04번", "q": "배관 식별 표시에서 '기름(유류)' 배관의 기본 식별색은?", "opts": ["주황색", "파랑색", "빨강색", "노랑색"], "correct": 0, "exp": "KS 배관 식별 표시: 물=파랑, 증기=빨강, 가스=노랑, 기름=주황입니다."},
  {"id": 5, "tag": "최근 1회차 - 05번", "q": "강관의 나사 절삭 작업 시 사용하는 절삭유의 주요 역할이 아닌 것은?", "opts": ["관 표면의 내식성 영구 증대", "마찰열 냉각", "공구의 마모 방지", "절삭 칩의 배출 촉진"], "correct": 0, "exp": "절삭유는 절삭 시 발생하는 열 냉각과 공구 보호 목적이며 영구 내식성을 주지는 않습니다."},
  {"id": 6, "tag": "최근 2회차 - 01번", "q": "배수 트랩에서 봉수가 파괴되는 원인 중, 하수관 내의 유속이 빠를 때 트랩 내 수두가 당겨져 물이 빠져나가는 현상은?", "opts": ["사이펀 작용(자기 사이펀)", "모세관 작용", "증발 현상", "분출 작용"], "correct": 0, "exp": "배수가 만수로 흘러내릴 때 관 내 음압이 발생하여 봉수를 끌고 들어가는 현상을 사이펀 작용이라 합니다."},
  {"id": 7, "tag": "최근 2회차 - 02번", "q": "펌프 흡입 배관 시공 시 배관 내 공기 고임을 방지하기 위해 사용하는 리듀서(부속)는?", "opts": ["편심 리듀서", "동심 리듀서", "소켓 리듀서", "플랜지 리듀서"], "correct": 0, "exp": "수평 흡입관에는 상부가 평평한 편심 리듀서를 사용하여 공기 고임(에어 포켓)을 방지합니다."},
  {"id": 8, "tag": "최근 2회차 - 03번", "q": "급탕 설비에서 단관식과 비교한 복관식(순환식)의 특징으로 옳은 것은?", "opts": ["밸브를 열면 즉시 온수가 나온다", "배관 공사비가 저렴하다", "열손실이 적다", "배관 구조가 매우 단순하다"], "correct": 0, "exp": "복관식은 온수가 배관을 계속 순환하므로 밸브를 열자마자 바로 온수를 사용할 수 있습니다."},
  {"id": 9, "tag": "최근 2회차 - 04번", "q": "주철관 이음 중 수구(Bell)와 삽구(Spigot) 사이에 얀과 납을 넣어 타격 체결하는 이음은?", "opts": ["소켓(메카니컬) 이음", "플랜지 이음", "용접 이음", "나사 이음"], "correct": 0, "exp": "주철관 소켓 이음 방식 중 과거 내식성 주철관 시공 시 수구/삽구 체결을 주로 사용했습니다."},
  {"id": 10, "tag": "최근 2회차 - 05번", "q": "아크 용접 시 전류가 너무 높거나 용접 속도가 너무 빠를 때 용접봉 모재 가장자리가 파이는 결함은?", "opts": ["언더컷", "오버랩", "기공", "슬래그 혼입"], "correct": 0, "exp": "과도한 전류 및 빠른 속도로 인해 모재 부위가 파이는 현상을 언더컷이라 합니다."},
  {"id": 11, "tag": "최근 3회차 - 01번", "q": "공기조화 설비에서 여과기(필터), 공기 가열기, 공기 냉각기, 가습기 등을 하나로 수용하는 장치는?", "opts": ["공기조화기(AHU)", "냉동기", "보일러", "냉각탑"], "correct": 0, "exp": "공기조화기(Air Handling Unit)는 공기 처리용 각종 장치를 하나의 케이싱에 수용한 장치입니다."},
  {"id": 12, "tag": "최근 3회차 - 02번", "q": "보일러 급수 중의 경도 성분(칼슘, 마그네슘)이 열을 받아 관벽에 착착 침전·결착되는 물질은?", "opts": ["스케일(Scale)", "피팅(Pitting)", "캐리오버", "프라이밍"], "correct": 0, "exp": "급수 중의 용존 고형물이 농축 침전되어 관벽에 고착되는 불순물을 스케일이라 합니다."},
  {"id": 13, "tag": "최근 3회차 - 03번", "q": "동관의 열간 가공 시 적정 작업 온도 범위로 가장 적절한 것은?", "opts": ["500℃ ~ 800℃", "150℃ ~ 250℃", "1000℃ ~ 1200℃", "100℃ 이하"], "correct": 0, "exp": "동관의 열간 구부림 작업 등의 가공 적정 온도는 약 500 ~ 800℃ 부근입니다."},
  {"id": 14, "tag": "최근 3회차 - 04번", "q": "가스 배관 시공 시 배관의 관경을 결정할 때 고려할 요소가 아닌 것은?", "opts": ["가스 계량기의 제조 회사", "가스의 유량", "배관의 길이", "허용 압력 손실"], "correct": 0, "exp": "가스 관경은 가스 유량, 배관 길이, 가스 비중, 허용 압력 손실 공식에 의해 결정됩니다."},
  {"id": 15, "tag": "최근 3회차 - 05번", "q": "천장에 설치된 배관 하중을 위에서 매달아 지지하는 지지장치는?", "opts": ["행거(Hanger)", "서포트(Support)", "스토퍼(Stopper)", "앵커(Anchor)"], "correct": 0, "exp": "상부 구조물에 매달아 배관 하중을 받쳐주는 지지대를 행거라 부릅니다."},
  {"id": 16, "tag": "최근 4회차 - 01번", "q": "보일러 부속 장치 중 연도 배기가스의 폐열을 이용하여 급수를 예열하는 장치는?", "opts": ["절탄기(Economizer)", "과열기", "공기예열기", "재열기"], "correct": 0, "exp": "절탄기는 배기가스 폐열로 급수 온도를 높여 연료 소비를 줄여줍니다."},
  {"id": 17, "tag": "최근 4회차 - 02번", "q": "관 내부의 절단 단면에 발생한 거스러미(지느러미)를 다듬는 공구는?", "opts": ["파이프 리머", "파이프 커터", "파이프 바이스", "오스타형 나사절삭기"], "correct": 0, "exp": "파이프 커터로 관을 절단한 후 내부 유체 저항을 유발하는 거스러미는 파이프 리머로 다듬습니다."},
  {"id": 18, "tag": "최근 4회차 - 03번", "q": "증기 배관 트랩 중 응축수와 증기의 밀도 차이(부력)를 이용하는 메카니컬 트랩은?", "opts": ["버킷 트랩", "바이메탈 트랩", "열동식 트랩", "오리피스 트랩"], "correct": 0, "exp": "플로트 트랩, 버킷 트랩 등은 부력(밀도 차)을 이용하는 기계식(메카니컬) 트랩입니다."},
  {"id": 19, "tag": "최근 4회차 - 04번", "q": "배관의 비파괴 검사(NDT) 중 침투액을 모재 표면에 바르고 침투시켜 결함을 확인하는 시험법은?", "opts": ["침투탐상검사(PT)", "방사선투과검사(RT)", "초음파탐상검사(UT)", "자분탐상검사(MT)"], "correct": 0, "exp": "PT(Liquid Penetrant Testing)는 표면 개구 결함에 침투액을 사용하는 비파괴 검사입니다."},
  {"id": 20, "tag": "최근 4회차 - 05번", "q": "안전 관리 수칙 중 가스 용기의 보관 및 취급 방법으로 틀린 것은?", "opts": ["직사광선이 내리쬐는 40℃ 이상의 장소에 보관한다", "용기는 항상 세워서 보관한다", "전도 방지 체인을 설치한다", "사용 불가 가스는 구분 표기한다"], "correct": 0, "exp": "가스 용기는 직사광선을 피하고 화기가 없는 40℃ 이하의 서늘한 곳에 보관해야 합니다."},
  {"id": 21, "tag": "최근 5회차 - 01번", "q": "수격작용(Water Hammering) 발생을 방지하기 위한 대책으로 옳지 않은 것은?", "opts": ["밸브를 급격하게 닫는다", "관내 유속을 느리게 유지한다", "에어 챔버(공기실)를 설치한다", "관경을 넉넉하게 선정한다"], "correct": 0, "exp": "밸브를 급격히 닫으면 관 내 유체 운동에너지가 급격히 압력으로 변해 강력한 수격작용이 일어납니다."},
  {"id": 22, "tag": "최근 5회차 - 02번", "q": "스테인리스 강관의 특징에 대한 설명으로 틀린 것은?", "opts": ["열전도율이 동관보다 매우 크다", "내식성이 뛰어나 위생적이다", "강도가 높고 관 두께를 얇게 제작할 수 있다", "저온 충격 강도가 뛰어나다"], "correct": 0, "exp": "스테인리스의 열전도율은 동관이나 강관에 비해 작습니다."},
  {"id": 23, "tag": "최근 5회차 - 03번", "q": "2개 이상의 엘보 나사 회전 여유를 활용해 배관의 신축을 흡수하는 신축이음쇠는?", "opts": ["스위블 이음", "슬리브 이음", "루프 이음", "볼 조인트"], "correct": 0, "exp": "스위블 이음은 나사의 회전 변형 여유를 이용하여 신축을 흡수합니다."},
  {"id": 24, "tag": "최근 5회차 - 04번", "q": "통기관의 설치 목적으로 옳지 않은 것은?", "opts": ["배수관 내 유체의 마찰 저항을 높이기 위해", "트랩의 봉수 파괴를 방지하기 위해", "배수관 내 악취 및 가스를 환기하기 위해", "배수의 흐름을 원활하게 하기 위해"], "correct": 0, "exp": "통기관은 트랩 봉수 보호 및 환기가 목적이며, 마찰 저항을 일부러 높이지 않습니다."},
  {"id": 25, "tag": "최근 5회차 - 05번", "q": "동관 공작 시 확관용 도구인 익스팬더(Expander)의 주요 용도는?", "opts": ["동관 끝을 확관하여 소켓 형태로 만듦", "동관 끝을 나팔 모양으로 확관함", "관 내부의 지느러미 제거", "관의 외경을 수평으로 다듬음"], "correct": 0, "exp": "익스팬더는 동관을 소켓 형태로 확관하여 다른 동관을 직접 끼워 넣을 수 있게 만들어 줍니다."}
];

let globalData = { totalCount: 0, correctCount: 0, wrongCount: 0, userStats: {} };
let currentQuestion = null;
let currentShuffledOpts = [];
let currentCorrectIdx = -1;

function initApp() {
  const saved = localStorage.getItem("piping_recent_5sets_v1");
  if(saved) {
    try { globalData = JSON.parse(saved); } catch(e){}
  }
  updateScoreBar();
  renderNextQuestion();
  document.getElementById('syncStatus').textContent = "🟢 최신 5회차 데이터 준비 완료";
}

function saveData() {
  localStorage.setItem("piping_recent_5sets_v1", JSON.stringify(globalData));
  document.getElementById('syncStatus').textContent = "🟢 학습 기록 저장 완료";
}

function getQuestionWeight(q) {
  const stat = globalData.userStats[q.id] || { c: 0, w: 0 };
  let weight = 3 + (stat.w * 2) - (stat.c * 1);
  return Math.max(weight, 1);
}

function pickBalancedQuestion() {
  const unselected = DATA_360.filter(q => !globalData.userStats[q.id]);
  if (unselected.length > 0 && Math.random() < 0.7) {
    return unselected[Math.floor(Math.random() * unselected.length)];
  }

  let totalWeight = 0;
  const weights = DATA_360.map(q => {
    const w = getQuestionWeight(q);
    totalWeight += w;
    return w;
  });

  let rand = Math.random() * totalWeight;
  for (let i = 0; i < DATA_360.length; i++) {
    rand -= weights[i];
    if (rand <= 0) return DATA_360[i];
  }
  return DATA_360[0];
}

function renderNextQuestion() {
  currentQuestion = pickBalancedQuestion();

  document.getElementById('qTag').textContent = currentQuestion.tag;
  const qStat = globalData.userStats[currentQuestion.id] || { c: 0, w: 0 };
  document.getElementById('qWeight').textContent = qStat.w > 0 ? "🔥 오답 누적: " + qStat.w + "회" : "출제순위: 보통";
  document.getElementById('qTitle').textContent = currentQuestion.q;

  const correctText = currentQuestion.opts[currentQuestion.correct];
  currentShuffledOpts = [...currentQuestion.opts].sort(() => Math.random() - 0.5);
  currentCorrectIdx = currentShuffledOpts.indexOf(correctText);

  const optsDiv = document.getElementById('qOpts');
  optsDiv.innerHTML = '';

  const nums = ["①", "②", "③", "④"];
  currentShuffledOpts.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = `${nums[idx]} ${optText}`;
    btn.onclick = () => selectOption(idx);
    optsDiv.appendChild(btn);
  });

  document.getElementById('qExp').classList.remove('show');
  document.getElementById('btnNext').style.display = 'none';
  updateScoreBar();
}

function selectOption(selectedIdx) {
  const isCorrect = selectedIdx === currentCorrectIdx;
  
  if (!globalData.userStats[currentQuestion.id]) {
    globalData.userStats[currentQuestion.id] = { c: 0, w: 0 };
  }

  globalData.totalCount++;
  if (isCorrect) {
    globalData.correctCount++;
    globalData.userStats[currentQuestion.id].c++;
  } else {
    globalData.wrongCount++;
    globalData.userStats[currentQuestion.id].w++;
  }
  saveData();

  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if (idx === currentCorrectIdx) btn.classList.add('correct');
    if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  const expBox = document.getElementById('qExp');
  expBox.textContent = currentQuestion.exp;
  expBox.classList.add('show');

  document.getElementById('btnNext').style.display = 'block';
  updateScoreBar();
}

function updateScoreBar() {
  const total = globalData.totalCount;
  const correct = globalData.correctCount;
  const wrong = globalData.wrongCount;
  const rate = total > 0 ? ((correct / total) * 100).toFixed(1) : "0.0";

  document.getElementById('statTotal').textContent = total + "회";
  document.getElementById('statCorrect').textContent = correct + "회";
  document.getElementById('statWrong').textContent = wrong + "회";
  document.getElementById('statRate').textContent = rate + "%";
}

document.getElementById('btnNext').onclick = () => {
  renderNextQuestion();
};

initApp();
</script>
</body>
</html>
