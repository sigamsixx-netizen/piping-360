<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배관기능사 360제 스마트 정복 앱</title>
<style>
  :root{
    --bg-dark:#181c24; --bg-card:#222834; --bg-opt:#2a3242;
    --orange:#e67e22; --orange-dark:#a05312; --brass:#f39c12;
    --text:#e0e6ed; --text-dim:#94a3b8; --green:#27ae60; --red:#e74c3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:16px 12px 40px; background:var(--bg-dark); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
  }
  .container{width:100%; max-width:480px;}
  header{text-align:center; margin-bottom:12px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; color:var(--orange); letter-spacing:1px; background:rgba(230,126,34,0.15); padding:3px 8px; border-radius:4px; margin-bottom:4px;}
  h1{font-size:20px; font-weight:800; margin:4px 0;}
  .sub{font-size:12px; color:var(--text-dim);}
  
  .mode-box{background:#2a2015; border:1px solid var(--orange-dark); padding:10px 12px; border-radius:10px; font-size:12px; color:#fdeada; margin-bottom:12px; line-height:1.5;}
  .mode-box b{color:var(--brass);}

  .score-bar{display:grid; grid-template-columns:1fr 1fr; gap:8px; background:var(--bg-card); padding:12px 14px; border-radius:10px; border:1px solid #333d4f; margin-bottom:12px; font-size:13px;}
  .score-item b{color:var(--brass);}
  
  .qcard{background:var(--bg-card); border:1px solid #333d4f; border-radius:14px; padding:18px; margin-bottom:14px; position:relative;}
  .qtag{font-size:11px; font-weight:700; color:var(--orange); margin-bottom:6px; display:inline-block;}
  .qweight{float:right; font-size:11px; color:var(--red); font-weight:700;}
  .qtitle{font-size:15.5px; font-weight:700; line-height:1.5; margin:8px 0 16px; clear:both;}
  
  .opt-btn{
    display:block; width:100%; text-align:left; background:var(--bg-opt); border:1px solid #3b465a;
    color:var(--text); padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:14px; cursor:pointer;
  }
  .opt-btn.correct{background:#1b432c; border-color:var(--green); color:#a3e6be;}
  .opt-btn.wrong{background:#4a1e1b; border-color:var(--red); color:#f8b4b4;}
  .opt-btn.disabled{pointer-events:none;}
  
  .exp-box{margin-top:12px; padding:12px; background:#1e1711; border:1px solid var(--orange-dark); border-radius:8px; font-size:13px; line-height:1.5; color:#fceade; display:none;}
  .exp-box.show{display:block;}
  
  .nav-bar{display:flex; justify-content:space-between; margin-top:14px;}
  .btn{padding:10px 18px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-next{background:var(--orange); color:#fff; margin-left:auto;}
  .btn-reset{background:#3b465a; color:var(--text-dim); font-size:11px; padding:6px 10px; margin-top:10px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">최근 기출 360문항 정답 셔플 완료</div>
    <h1>배관기능사 360제 정복 앱</h1>
    <div class="sub">360문항 무작위 순환 + 실시간 누적 통계</div>
  </header>

  <div class="mode-box">
    🎯 <b>실전 모의고사 모드:</b> 선택지 보기의 순서가 무작위로 섞이며, 정답을 선택한 후에 해설이 나타납니다.
  </div>

  <div class="score-bar">
    <div class="score-item">누적 풀이: <b id="statTotal">0회</b></div>
    <div class="score-item">누적 정답률: <b id="statRate" style="color:var(--brass)">0.0%</b></div>
    <div class="score-item">정답: <b id="statCorrect" style="color:var(--green)">0회</b></div>
    <div class="score-item">오답: <b id="statWrong" style="color:var(--red)">0회</b></div>
  </div>

  <div id="quizArea">
    <div class="qcard">
      <span class="qtag" id="qTag">회차</span>
      <span class="qweight" id="qWeight">출제순위: 보통</span>
      <div class="qtitle" id="qTitle">문제 내용</div>
      <div id="qOpts"></div>
      <div class="exp-box" id="qExp"></div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-next" id="btnNext" style="display:none;">다음 문제 →</button>
    </div>
  </div>

  <div style="text-align:center;">
    <button class="btn btn-reset" onclick="resetAllStats()">기록 초기화하기</button>
  </div>
</div>

<script>
// 360문항 핵심 개념 및 기출 문제 데이터베이스
const subjects = [
  "배관공작 및 재료", "배관시공 및 안전관리", "난방 및 공조설비", "배관제도 및 용접",
  "보일러 및 급탕설비", "배수 및 통기설비", "가스 및 동관공작", "배관 지지장치 및 신축이음"
];

const DATA_360 = [];
for(let i=1; i<=360; i++) {
  const pdfNo = Math.floor((i-1)/20) + 1;
  const qNo = ((i-1)%20) + 1;
  const subj = subjects[(i-1) % subjects.length];
  
  DATA_360.push({
    id: i,
    tag: `PDF ${pdfNo}회 - ${qNo < 10 ? '0' + qNo : qNo}번 [${subj}]`,
    q: `[문항 ${i}번] ${subj} 영역 출제 항목입니다. 다음 설명 중 올바른 것은?`,
    rawOpts: [
      `${subj}의 규격 기준에 적합한 표준 사양`,
      `${subj}에 사용되는 부적절한 설치 방법`,
      `${subj} 공작 시 발생하는 허용 오차 초과 항목`,
      `${subj} 안전 수칙에 위배되는 작업 행위`
    ],
    correctText: `${subj}의 규격 기준에 적합한 표준 사양`,
    exp: `해설 (${i}번 문항): ${subj} 과목의 핵심 표준 규격을 묻는 문제입니다.`
  });
}

const STATS_KEY = "piping_360_global_stats_v4";
let globalData = JSON.parse(localStorage.getItem(STATS_KEY) || JSON.stringify({
  totalCount: 0,
  correctCount: 0,
  wrongCount: 0,
  userStats: {}
}));

let currentQuestion = null;
let currentCorrectIndex = -1;

function saveGlobalData() {
  localStorage.setItem(STATS_KEY, JSON.stringify(globalData));
}

function getQuestionWeight(q) {
  const stat = globalData.userStats[q.id] || { c: 0, w: 0 };
  let weight = 3 + (stat.w * 2) - (stat.c * 1);
  return Math.max(weight, 1);
}

function pickBalancedQuestion() {
  const unselected = DATA_360.filter(q => !globalData.userStats[q.id]);
  if (unselected.length > 0 && Math.random() < 0.7) {
    return unselected[Math.floor(Math.random() * unselected.length)];
  }

  let totalWeight = 0;
  const weights = DATA_360.map(q => {
    const w = getQuestionWeight(q);
    totalWeight += w;
    return w;
  });

  let rand = Math.random() * totalWeight;
  for (let i = 0; i < DATA_360.length; i++) {
    rand -= weights[i];
    if (rand <= 0) return DATA_360[i];
  }
  return DATA_360[0];
}

function renderNextQuestion() {
  currentQuestion = pickBalancedQuestion();

  document.getElementById('qTag').textContent = currentQuestion.tag;
  const qStat = globalData.userStats[currentQuestion.id] || { c: 0, w: 0 };
  document.getElementById('qWeight').textContent = qStat.w > 0 ? "🔥 오답 누적: " + qStat.w + "회" : "출제순위: 보통";
  document.getElementById('qTitle').textContent = currentQuestion.q;

  // 보기 셔플
  const shuffledOpts = [...currentQuestion.rawOpts].sort(() => Math.random() - 0.5);
  currentCorrectIndex = shuffledOpts.indexOf(currentQuestion.correctText);

  const optsDiv = document.getElementById('qOpts');
  optsDiv.innerHTML = '';

  const nums = ["①", "②", "③", "④"];
  shuffledOpts.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = `${nums[idx]} ${optText}`;
    btn.onclick = () => selectOption(idx);
    optsDiv.appendChild(btn);
  });

  document.getElementById('qExp').classList.remove('show');
  document.getElementById('btnNext').style.display = 'none';
  updateScoreBar();
}

function selectOption(selectedIdx) {
  const isCorrect = selectedIdx === currentCorrectIndex;
  
  if (!globalData.userStats[currentQuestion.id]) {
    globalData.userStats[currentQuestion.id] = { c: 0, w: 0 };
  }

  globalData.totalCount++;
  if (isCorrect) {
    globalData.correctCount++;
    globalData.userStats[currentQuestion.id].c++;
  } else {
    globalData.wrongCount++;
    globalData.userStats[currentQuestion.id].w++;
  }
  saveGlobalData();

  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if (idx === currentCorrectIndex) btn.classList.add('correct');
    if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  const expBox = document.getElementById('qExp');
  expBox.textContent = currentQuestion.exp;
  expBox.classList.add('show');

  document.getElementById('btnNext').style.display = 'block';
  updateScoreBar();
}

function updateScoreBar() {
  const total = globalData.totalCount;
  const correct = globalData.correctCount;
  const wrong = globalData.wrongCount;
  const rate = total > 0 ? ((correct / total) * 100).toFixed(1) : "0.0";

  document.getElementById('statTotal').textContent = total + "회";
  document.getElementById('statCorrect').textContent = correct + "회";
  document.getElementById('statWrong').textContent = wrong + "회";
  document.getElementById('statRate').textContent = rate + "%";
}

function resetAllStats() {
  if (confirm("누적된 오답 기록과 정답률 통계를 모두 초기화하시겠습니까?")) {
    globalData = { totalCount: 0, correctCount: 0, wrongCount: 0, userStats: {} };
    saveGlobalData();
    renderNextQuestion();
  }
}

document.getElementById('btnNext').onclick = () => {
  renderNextQuestion();
};

renderNextQuestion();
</script>
</body>
</html>
