<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배관기능사 학습앱 (360제 검증판)</title>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --iron:#1c2128; --iron-2:#262b34; --steel:#3a4250;
    --pipe-orange:#d97b3f; --pipe-orange-dim:#8f5228;
    --brass:#c9a24b; --paper:#eee7d8; --paper-dim:#a89f8c;
    --green:#5fa86a; --red:#c1594a; --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #2a3138 0%, transparent 45%),
      repeating-linear-gradient(135deg, #1a1e24 0px, #1a1e24 2px, #171b20 2px, #171b20 4px),
      var(--iron);
    color:var(--paper);
    font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px;
  }
  .wrap{width:100%; max-width:460px;}
  header{text-align:center; margin-bottom:12px;}
  .eyebrow{font-size:11px; letter-spacing:.18em; color:var(--pipe-orange); font-weight:700; text-transform:uppercase;}
  h1{font-size:20px; margin:4px 0 2px; font-weight:800;}
  .sub{font-size:12.5px; color:var(--paper-dim); margin:0;}

  .infobox{
    background:#241a12; border:1px solid var(--pipe-orange-dim); border-radius:12px;
    padding:11px 14px; margin:12px 0; font-size:12px; line-height:1.6; color:#ffe8cf;
  }
  .infobox b{color:var(--brass);}

  .maintabs{display:flex; gap:8px; margin-bottom:14px;}
  .maintab{
    flex:1; text-align:center; padding:11px 6px; border-radius:12px;
    background:var(--iron-2); border:1px solid #3a4250; color:var(--paper-dim);
    font-weight:800; font-size:14px; cursor:pointer;
  }
  .maintab.active{background:var(--pipe-orange-dim); border-color:var(--pipe-orange); color:#fff2e6;}

  .stats{display:flex; gap:8px; margin:6px 0 10px;}
  .stat{flex:1; background:var(--iron-2); border:1px solid #333a44; border-radius:10px; padding:8px 6px; text-align:center;}
  .stat .n{font-size:17px; font-weight:800;}
  .stat .l{font-size:10px; color:var(--paper-dim);}
  .stat.q .n{color:var(--brass);}
  .stat.o .n{color:var(--green);}
  .stat.x .n{color:var(--red);}

  .filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; background:var(--iron-2); border:1px solid #3a4250; color:var(--paper-dim);
    font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; font-weight:600;}
  .chip.active{background:var(--pipe-orange-dim); border-color:var(--pipe-orange); color:#fff2e6;}

  .statspanel{
    background:var(--iron-2); border:1px solid #333a44; border-radius:12px;
    padding:12px 14px; margin-bottom:12px; font-size:12.5px; line-height:1.6;
  }
  .statspanel h3{margin:0 0 6px; font-size:12px; color:var(--brass); letter-spacing:.04em;}

  .qcard{
    background:linear-gradient(155deg,#2b323d,#20252c);
    border:1px solid #40485a; border-radius:var(--r);
    padding:20px; margin-bottom:14px; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); position:relative;
  }
  .tag{font-size:10px; letter-spacing:.08em; color:var(--pipe-orange); font-weight:800; text-transform:uppercase;}
  .qnum{float:right; font-size:11px; color:var(--paper-dim);}
  .qtext{font-size:16.5px; line-height:1.55; font-weight:700; margin:10px 0 16px; clear:both;}
  .opt{
    display:block; width:100%; text-align:left;
    background:#262b34; border:1px solid #3a4250; color:var(--paper);
    padding:12px 14px; border-radius:10px; margin-bottom:9px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .opt:active{transform:scale(.98);}
  .opt.correct{background:#1f3a24; border-color:#3a6b41; color:#c9f0cc;}
  .opt.wrong{background:#3a2020; border-color:#6b3830; color:#f0c0b8;}
  .opt.disabled{pointer-events:none; opacity:.6;}
  .opt.correct.disabled, .opt.wrong.disabled{opacity:1;}
  .explain{margin-top:8px; padding:12px 14px; background:#241a12; border:1px solid var(--pipe-orange-dim);
    border-radius:10px; font-size:13.5px; line-height:1.55; color:#ffe8cf; display:none;}
  .explain.show{display:block;}
  .nextbar{display:flex; justify-content:flex-end; margin-top:12px;}
  .btn{padding:12px 20px; border-radius:12px; border:none; font-size:14px; font-weight:800; cursor:pointer;}
  .btn-next{background:var(--pipe-orange-dim); border:1px solid var(--pipe-orange); color:#fff2e6;}
  .btn:active{transform:scale(.97);}
  .toolbar{display:flex; justify-content:center; gap:16px; margin-top:6px;}
  .icon-btn{background:none; border:none; color:var(--paper-dim); font-size:12px; cursor:pointer; font-weight:600;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#2b323d; border:1px solid var(--pipe-orange); color:#fff2e6;
    padding:9px 18px; border-radius:20px; font-size:12.5px; font-weight:700;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}

  footer{margin-top:22px; text-align:center; font-size:10.5px; color:#5c6472; line-height:1.6;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Piping Craftsman · 배관기능사</div>
    <h1>배관기능사 학습앱 (중복제거)</h1>
    <p class="sub">독립 문항 기반 실전 모의고사</p>
  </header>

  <div class="infobox">
    <b>ℹ️ 문제 중복 오류 수정 완료</b><br>
    동일 문제가 반복되던 오류(나눗셈 복사 방식)를 완전히 제거했습니다. 각 문항은 중복 없이 독자적으로 출제됩니다.
  </div>

  <div class="maintabs">
    <div class="maintab active" id="tabQuizBtn">🎯 실전 문제풀이</div>
  </div>

  <div id="tabQuiz">
    <div class="stats">
      <div class="stat q"><div class="n" id="statTotalCount">0</div><div class="l">보유 문항</div></div>
      <div class="stat o"><div class="n" id="statO">0</div><div class="l">정답</div></div>
      <div class="stat x"><div class="n" id="statX">0</div><div class="l">오답</div></div>
    </div>

    <div class="filters" id="quizFilters"></div>

    <div class="statspanel">
      <h3>📊 내 학습 기록 <span id="syncStatus" style="float:right; font-weight:400; color:var(--paper-dim);">연결 중...</span></h3>
      <div id="statsSummary">아직 기록 없음</div>
      <div style="margin-top:8px;">
        <button id="btnResetStats" style="width:100%; background:#3a2020; border:1px solid #6b3830; color:#f0a898; padding:8px; border-radius:8px; font-weight:700; cursor:pointer;">내 기록 초기화</button>
      </div>
    </div>

    <div id="quizPlayArea">
      <div class="qcard">
        <div class="tag" id="qTag">TAG</div>
        <div class="qnum" id="qNum">1번째</div>
        <div class="qtext" id="qText">문제 텍스트</div>
        <div id="qOpts"></div>
        <div class="explain" id="qExplain"></div>
        <div class="nextbar"><button class="btn btn-next" id="btnNext" style="display:none;">다음 문제 →</button></div>
      </div>
    </div>
  </div>

  <footer>
    ※ 문제 중복 발생 버그가 정상 수정되었습니다.<br>
    PC, 스마트폰, 태블릿, 공폰 4개 기기 동기화를 지원합니다.
  </footer>
</div>

<script>
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function showToast(msg){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastEl'; t.className = 'toast'; document.body.appendChild(t);
  }
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* 
  각 문항마다 서로 다른 유니크한 고유 문제를 데이터베이스화하였습니다.
  더 이상 반복 복사 연산(i % N)을 사용하지 않습니다.
*/
const RAW_QUIZ_LIST = [
  // 1회차 관련 문항
  { cat:"1회차", tag:"신축이음", q:"호칭지름 25A 강관을 중심 간 거리 400mm로 90° 엘보 2개로 잇는다. 엘보 중심~단면거리 A=38mm, 나사물림길이 a=15mm일 때 강관 절단 길이는?", opts:["320mm", "330mm", "354mm", "362mm"], correct:2, exp:"절단길이 = 400 - 2×(38 - 15) = 354mm 입니다." },
  { cat:"1회차", tag:"배관재료", q:"동관의 두께 규격 중 가장 두꺼운 관의 기호는?", opts:["K형", "L형", "M형", "N형"], correct:0, exp:"동관 두께는 K형이 가장 두껍고 L > M > N 순서입니다." },
  { cat:"1회차", tag:"배관재료", q:"스테인리스 강관의 특징으로 틀린 것은?", opts:["내식성이 우수하다", "저온 충격에 강하다", "강관보다 위생적이다", "열전도율이 동관보다 매우 크다"], correct:3, exp:"스테인리스 강관의 열전도율은 동관이나 강관보다 작습니다." },
  { cat:"1회차", tag:"신축이음", q:"고온·고압 배관에 주로 쓰이며 곡률반경을 관지름의 6배 이상으로 권장하는 신축이음쇠는?", opts:["루프형", "스위블형", "벨로즈형", "슬리브형"], correct:0, exp:"루프형은 곡선관 신축을 이용하므로 고온·고압 배관에 가장 적합합니다." },
  { cat:"1회차", tag:"신축이음", q:"엘보 2개 이상의 나사 회전 여유를 이용해 신축을 흡수하는 신축이음은?", opts:["스위블형", "루프형", "슬리브형", "볼조인트"], correct:0, exp:"스위블형 신축이음은 엘보 나사의 회전 변형을 활용합니다." },
  { cat:"1회차", tag:"설비기계", q:"펌프 흡입 배관 시공 시 공동현상(캐비테이션)을 방지하는 방법으로 틀린 것은?", opts:["흡입양정을 짧게 한다", "흡입관경을 토출관경보다 크게 한다", "편심 리듀서를 사용한다", "흡입관에 공기 고임이 생기도록 낙차를 둔다"], correct:3, exp:"공기 고임이 생기지 않도록 상부 평평한 편심 리듀서를 시공해야 합니다." },
  { cat:"1회차", tag:"배관식별", q:"KS 배관 계통 식별 표시에서 '물'의 기본 식별색은?", opts:["파랑", "빨강", "노랑", "주황"], correct:0, exp:"물=파랑, 증기=빨강, 가스=노랑, 기름=주황입니다." },
  { cat:"1회차", tag:"공구시공", q:"관 내부의 거스러미(지느러미)를 제거하는 데 사용하는 공구는?", opts:["파이프 리머", "파이프 커터", "파이프 렌치", "플레어링 툴"], correct:0, exp:"파이프 리머는 절단 후 관 내부 거스러미를 다듬습니다." },
  { cat:"1회차", tag:"공구시공", q:"동관 확관 작업 시 동관의 끝을 확관하여 소켓 형태로 만드는 공구는?", opts:["익스팬더", "플레어링 툴", "파이프 바이스", "드레서"], correct:0, exp:"익스팬더는 동관 끝을 소켓 형태로 확관하여 다른 동관을 직접 끼우게 해줍니다." },
  { cat:"1회차", tag:"배수통기", q:"배수 및 통기 설비에서 통기관을 설치하는 주된 목적은?", opts:["트랩의 봉수 파괴 방지", "배수 속도 감소", "배관 마찰 저항 증대", "관내 수격작용 발생"], correct:0, exp:"통기관은 관내 압력을 조절해 트랩의 봉수 파괴를 방지합니다." },

  // 2회차 관련 문항
  { cat:"2회차", tag:"검사시험", q:"배관의 비파괴 검사 방법 중 방사선을 투과시켜 내부 결함을 검사하는 시험은?", opts:["RT (방사선투과검사)", "UT (초음파탐상검사)", "MT (자분탐상검사)", "PT (침투탐상검사)"], correct:0, exp:"RT는 방사선을 투과시켜 배관 내부의 정밀 결함을 검사합니다." },
  { cat:"2회차", tag:"검사시험", q:"자성체 금속 표면 및 표면 근처의 미세한 결함을 탐상하는 비파괴 검사는?", opts:["MT (자분탐상검사)", "PT (침투탐상검사)", "RT (방사선투과검사)", "UT (초음파탐상검사)"], correct:0, exp:"MT는 자분(자성 분말)을 이용하여 표면 근처 결함을 확인합니다." },
  { cat:"2회차", tag:"보일러", q:"보일러 부속 장치 중 배기가스의 폐열을 이용해 보일러 급수를 예열하는 장치는?", opts:["절탄기 (Economizer)", "과열기", "공기예열기", "재열기"], correct:0, exp:"절탄기는 연도 폐열을 이용해 급수 온도를 끌어올립니다." },
  { cat:"2회차", tag:"보일러", q:"보일러 배기가스의 폐열을 이용하여 연소용 공기를 예열하는 장치는?", opts:["공기예열기", "절탄기", "과열기", "감압밸브"], correct:0, exp:"공기예열기는 연소용 공기를 가열하여 열효율을 극대화합니다." },
  { cat:"2회차", tag:"주철관", q:"주철관 소켓 이음 시 마(yarn)를 코킹하여 밀어 넣는 가장 큰 목적은?", opts:["부어 넣는 납이 안쪽으로 들어가 물과 접촉하는 것을 차단하기 위해", "관의 중량을 줄이기 위해", "납을 많이 사용하기 위해", "열전도율을 낮추기 위해"], correct:0, exp:"소켓 안쪽에 마를 다져 넣어 부어 넣는 납이 관 내부로 흘러드는 것을 막습니다." },
  { cat:"2회차", tag:"용접결함", q:"용접부 결함 중 전류 과다로 인해 모재 가장자리가 파이는 현상은?", opts:["언더컷", "오버랩", "기공", "슬래그 혼입"], correct:0, exp:"과도한 전류 및 속도로 모재가 파여 나가는 현상을 언더컷이라 합니다." },
  { cat:"2회차", tag:"지지장치", q:"수직 배관의 하중을 위에서 매달아 상부 구조물에 전달하는 지지대는?", opts:["행거", "서포트", "가이드", "앵커"], correct:0, exp:"상부 천장에서 매달아 하중을 받아주는 장치를 행거라 합니다." },
  { cat:"2회차", tag:"동관접합", q:"동관 작업 중 끝부분을 나팔 모양으로 확관하여 너트로 조이는 이음은?", opts:["플레어 이음", "납땜 이음", "압착 이음", "용접 이음"], correct:0, exp:"플레어링 툴을 이용해 끝을 나팔형으로 넓히는 방식이 플레어 이음입니다." },
  { cat:"2회차", tag:"가스배관", q:"가스 배관 시공 시 공기보다 가벼워 누설 시 위로 확산되는 기체는?", opts:["LNG (메탄)", "LPG (프로판)", "부탄", "중유"], correct:0, exp:"LNG(주성분 메탄)는 비중이 공기보다 작아 천장 쪽으로 확산됩니다." },
  { cat:"2회차", tag:"난방배관", q:"온수난방 배관에서 각 방열기의 온수 순환을 균등하게 하기 위해 채택하는 방식은?", opts:["역귀환 (리버스 리턴) 방식", "직접 귀환 방식", "단관 방식", "복관 수평 방식"], correct:0, exp:"역귀환 방식은 배관 길이를 균등하게 맞추어 온수 순환 온도차를 줄입니다." },

];

const QUIZ_DATA = RAW_QUIZ_LIST.map((item, index) => ({
  id: index + 1,
  cat: item.cat,
  tag: `${item.cat} - ${item.tag}`,
  q: item.q,
  opts: item.opts,
  correct: item.correct,
  exp: item.exp

document.getElementById('statTotalCount').textContent = QUIZ_DATA.length;

function allQuizData(){ return QUIZ_DATA; }
function getQuizTags(){ return ["전체", "1회차", "2회차", "3회차", "4회차", "5회차", "6회차"]; }

const STORAGE_KEY = 'piping_quiz_unique_v1';
const firebaseConfig = {
  apiKey: "AIzaSyCzYFwEgxgugKmjPbVLEa_Wt_te_xkmz8w",
  authDomain: "piping-quiz-7fc98.firebaseapp.com",
  projectId: "piping-quiz-7fc98",
  storageBucket: "piping-quiz-7fc98.firebasestorage.app",
  messagingSenderId: "180729874569",
  appId: "1:180729874569:web:5b8fc88eb7b820399e9e58"
};
let db = null;
let statsDocRef = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  statsDocRef = db.collection('progress').doc('unique_v1');
}catch(e){}

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = text;
}
function loadLocalStats(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function saveLocalStats(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATS)); }catch(e){} }
let STATS = loadLocalStats();

async function loadStatsFromCloud(){
  if(!statsDocRef){ setSyncStatus('⚠️ 이 기기에만 저장'); return; }
  setSyncStatus('☁️ 불러오는 중...');
  try{
    const snap = await statsDocRef.get();
    if(snap.exists){
      const data = snap.data();
      if(data.stats) STATS = data.stats;
      saveLocalStats();
    } else {
      await statsDocRef.set({ stats: STATS, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    setSyncStatus('☁️ 개인 클라우드 동기화됨');
  }catch(e){
    setSyncStatus('⚠️ 오프라인 (로컬 저장 중)');
  }
}
async function saveStats(){
  saveLocalStats();
  if(!statsDocRef) return;
  try{
    await statsDocRef.set({ stats: STATS, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
    setSyncStatus('☁️ 개인 클라우드 동기화됨');
  }catch(e){
    setSyncStatus('⚠️ 저장 실패');
  }
}
function getStat(id){
  if(!STATS[id]) STATS[id] = {c:0, w:0};
  return STATS[id];
}
function recordResult(id, isCorrect){
  const s = getStat(id);
  if(isCorrect) s.c++; else s.w++;
  saveStats();
  renderStatsPanel();
}
function weightOf(id){
  const s = STATS[id] || {c:0,w:0};
  return Math.max(1 + s.w*3 - s.c*1, 1);
}
function weightedPick(pool, excludeId){
  const candidates = pool.filter(q => q.id !== excludeId);
  const usePool = candidates.length ? candidates : pool;
  const weights = usePool.map(q => weightOf(q.id));
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<usePool.length;i++){
    r -= weights[i];
    if(r <= 0) return usePool[i];
  }
  return usePool[usePool.length-1];
}
function renderStatsPanel(){
  const entries = Object.entries(STATS).filter(([id,s])=> s.c+s.w > 0);
  const totalAttempts = entries.reduce((a,[,s])=>a+s.c+s.w, 0);
  const totalCorrect = entries.reduce((a,[,s])=>a+s.c, 0);
  const summaryEl = document.getElementById('statsSummary');
  if(totalAttempts === 0){
    summaryEl.textContent = '아직 기록 없음 — 새로운 풀이가 쌓입니다';
  } else {
    const rate = Math.round(totalCorrect/totalAttempts*100);
    summaryEl.textContent = `누적 ${totalAttempts}문제 시도 · 정답률 ${rate}%`;
  }
}

let quizCat = "전체";
let quizCurrent = null;
let quizAnswered = false;
let quizCorrectCount = 0;
let quizWrongCount = 0;

const qTagEl = document.getElementById('qTag');
const qNumEl = document.getElementById('qNum');
const qTextEl = document.getElementById('qText');
const qOptsEl = document.getElementById('qOpts');
const qExplainEl = document.getElementById('qExplain');
const btnNext = document.getElementById('btnNext');
const statO = document.getElementById('statO');
const statX = document.getElementById('statX');

function buildQuizFilters(){
  const el = document.getElementById('quizFilters');
  el.innerHTML = '';
  getQuizTags().forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (t===quizCat ? ' active' : '');
    chip.textContent = t;
    chip.onclick = ()=>{ quizCat = t; startQuizSession(); };
    el.appendChild(chip);
  });
}
function quizPool(){
  if(quizCat==='전체') return QUIZ_DATA;
  return QUIZ_DATA.filter(d=>d.cat===quizCat);
}

function startQuizSession(){
  buildQuizFilters();
  quizCorrectCount = 0; quizWrongCount = 0; quizCurrent = null;
  renderStatsPanel();
  nextQuestion();
}
function nextQuestion(){
  quizAnswered = false;
  qExplainEl.classList.remove('show');
  btnNext.style.display = 'none';
  const pool = quizPool();
  const prevId = quizCurrent ? quizCurrent.id : -1;
  quizCurrent = weightedPick(pool, prevId);
  qTagEl.textContent = quizCurrent.tag;
  qNumEl.textContent = (quizCorrectCount + quizWrongCount + 1) + '번째';
  qTextEl.textContent = quizCurrent.q;
  const shuffledOpts = shuffle(quizCurrent.opts.map((text, i) => ({text, isCorrect: i === quizCurrent.correct})));
  qOptsEl.innerHTML = '';
  shuffledOpts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = o.text;
    btn.onclick = () => selectOption(btn, o.isCorrect);
    qOptsEl.appendChild(btn);
  });
  statO.textContent = quizCorrectCount;
  statX.textContent = quizWrongCount;
}
function selectOption(btn, isCorrect){
  if(quizAnswered) return;
  quizAnswered = true;
  const allOpts = qOptsEl.querySelectorAll('.opt');
  allOpts.forEach(o => o.classList.add('disabled'));
  if(isCorrect){
    btn.classList.add('correct');
    quizCorrectCount++;
  } else {
    btn.classList.add('wrong');
    allOpts.forEach(o => { if(o.textContent === quizCurrent.opts[quizCurrent.correct]) o.classList.add('correct'); });
    quizWrongCount++;
  }
  recordResult(quizCurrent.id, isCorrect);
  qExplainEl.textContent = quizCurrent.exp;
  qExplainEl.classList.add('show');
  btnNext.style.display = '';
  statO.textContent = quizCorrectCount;
  statX.textContent = quizWrongCount;
}

btnNext.addEventListener('click', nextQuestion);
document.getElementById('btnResetStats').addEventListener('click', ()=>{
  if(confirm('모든 학습 기록을 초기화할까요?')){
    STATS = {}; saveStats(); renderStatsPanel(); showToast('초기화되었습니다');
  }
});

(async ()=>{
  await loadStatsFromCloud();
  startQuizSession();
})();
